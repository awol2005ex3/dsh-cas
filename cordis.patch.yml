# 本插件作为 profile 层贡献的 patch：把插件注册进配置树。
#
# Node 半：loader.import('dsh-user-manager') 解析到主入口 lib/index.js，
# 注册 /user-manager/* 鉴权路由，并影子化 /api/<method> 做鉴权与过滤。
# 浏览器半：client-modules（dsh.client 服务）扫描到本包的 dsh.client 声明后，
# 经 /plugins/<id>/client.js 提供 lib/client.js，浏览器 shell 为同一行名
# 创建 fiber 并物化客户端模块，挂载登录遮罩与用户管理面板。
#
# 注意：patch 按 id 整体替换 config，不会深合并。改本文件请保留整行。
- insert:
    - id: cas
      name: dsh-cas
